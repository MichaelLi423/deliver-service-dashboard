function submitAction(t,form){let amountRules={core:[["contract",true]],batch:[["original",false],["discounted",false]],logistics:[["budget",true],["deal",true],["cost",true]],drop:[["amount",true]],damage:[["qty",true],["amount",true]]}[t]||[];if(!amountRules.every(([name,required])=>validatePositive(form,name,required)))return;if(!form.reportValidity())return;let d=Object.fromEntries(new FormData(form).entries()),x=p();
if(t==="core"){x.client=d.client;x.ecc=d.ecc;x.contract=Number(d.contract);x.finalAmount=x.finalAmount||x.contract;x.scope=d.scope;x.intake=d.intake;x.status=x.actualInstalled?"待验收":records(visits,x.id).length?"执行中":"待执行";x.tags=x.tags.filter(v=>v!=="缺核心资料"&&v!=="未进单先执行");removeTodos(y=>y.type==="缺进单核心资料")}
if(t==="batch"){batches.unshift({pid:x.id,id:d.batchId,date:d.date,carrier:d.carrier||"待补",original:d.original===""?null:Number(d.original),discounted:d.discounted===""?null:Number(d.discounted),budget:null,deal:null,cost:null,registered:null});x.batches++;if(d.carrier)removeTodos(y=>y.type==="缺运输公司");state.tab="搬迁批次"}
if(t==="instrument"){instruments.unshift({id:next("I"),projectId:x.id,name:d.name,model:d.model,sn:d.sn||"序列号待补",batch:d.batch,shipto:"未记录",dis:"未开始",install:"未开始",qr:d.qr,repair:"无"});x.instruments++;state.tab="搬迁仪器"}
if(t==="visit"){let types=all('[name="workType"]:checked').map(e=>e.value),instrumentIds=all('[name="visitInstrumentId"]:checked').map(e=>e.value);if(!types.length||!instrumentIds.length)return;let completedInstall=types.includes("装机")&&d.status==="已完成",linked=records(instruments,x.id).filter(i=>instrumentIds.includes(i.id));visits.unshift({pid:x.id,id:next("V"),date:d.date,type:types.join("、"),engineers:d.engineers,instrumentIds,status:d.status});x.visits++;if(completedInstall){x.actualInstalled=true;x.actualInstalledAt=d.date;linked.forEach(i=>i.install="已完成");if(!isFormal(x))x.status="待进单";else if(["待执行","执行中"].includes(x.status)){x.status="待验收";linked.forEach(i=>{if(!addressUpdates.some(a=>a.instrumentId===i.id&&a.projectId===x.id)&&!todos.some(t=>t.projectId===x.id&&t.type==="缺目的地址/Ship-to"&&t.instrumentId===i.id))todos.unshift({id:next("T"),pid:x.id,projectId:x.id,instrumentId:i.id,title:`补录仪器 ${i.sn} 的实际新址`,type:"缺目的地址/Ship-to",due:"无日期",bucket:"undated",obj:`搬迁仪器 ${i.sn}`})})}}else if(isFormal(x)&&x.status==="待执行")x.status="执行中";removeTodos(y=>y.type==="缺工程师");state.tab="上门活动"}
if(t==="order"){if(orderNoExists(d.orderNo)){$("#order-action-error").textContent=`服务单号 ${d.orderNo} 已存在，请更换后再保存。`;return}orders.unshift({pid:x.id,type:d.orderType,no:d.orderNo,date:d.date,engineers:d.engineers,note:d.note});x.orders++;state.tab="申请与维修"}
if(t==="logistics"){let b=records(batches).find(v=>v.id===d.batchId);if(b){b.registered=d.registered;b.budget=Number(d.budget);b.deal=Number(d.deal);b.cost=Number(d.cost)}removeTodos(y=>y.type==="批次运输后缺物流费用记录");state.tab="搬迁批次"}
if(t==="acceptance"){x.status="待掉票";x.tags=x.tags.filter(v=>v!=="待验收报告");x.tags.push("已有验收报告");state.tab="费用与掉票"}
if(t==="drop"){let amount=Number(d.amount),rem=x.finalAmount-x.dropped;if(!(amount>0)||amount>rem){$("#drop-error").textContent=amount>rem?"累计掉票不能超过最终可确认金额。":"掉票金额必须大于 0。";return}x.dropped+=amount;x.dropHistory=true;drops.unshift({pid:x.id,date:d.date,amount,status:"有效"});x.status=x.dropped>=x.finalAmount?"已完成":"待掉票";state.tab="费用与掉票"}
if(t==="shipto"){if(d.status==="已完成"&&!d.account){$("#ship-error").textContent="申请完成前必须补入 Account ID。";return}if(d.account&&accountIdExists(d.account)){$("#ship-error").textContent=`Account ID ${d.account} 已存在，请核对后再保存。`;return}shipRequests.unshift({pid:x.id,client:d.client,address:d.address,account:d.account,status:d.status});if(!["已完成","已取消"].includes(d.status))todos.unshift({id:next("T"),pid:x.id,title:"跟进 Ship-to 申请",type:"Ship-to 申请未完成",due:"无日期",bucket:"undated",obj:"Ship-to 申请"});state.tab="申请与维修"}
if(t==="damage"){if(d.status==="已关闭未修复"&&!d.closeReason){$("#damage-error").textContent="选择已关闭未修复时必须填写关闭原因。";return}repairs.unshift({pid:x.id,projectId:x.id,instrumentId:d.instrumentId,reason:d.reason,status:d.status,part:d.part,qty:Number(d.qty),amount:Number(d.amount),currency:d.currency,note:d.note+(d.closeReason?"；关闭原因："+d.closeReason:"")});x.tags=[...new Set([...x.tags,"维修处理中"])];state.tab="申请与维修"}state.overlay=null;toast(actionMeta(t)[1]+"已保存","项目队列、当前上下文与详情已同步更新。")}
function removeTodosFor(pid,test){for(let i=todos.length-1;i>=0;i--)if(todos[i].pid===pid&&test(todos[i]))todos.splice(i,1)}function removeTodos(test){removeTodosFor(state.pid,test)}
function submitModule(type,form){if(!form.reportValidity())return;let d=Object.fromEntries(new FormData(form).entries());if(type==="qr"){let types=[...new Set(all('[name="qrType"]:checked').map(e=>e.value))];if(!types.length){$("#qr-error").textContent="请至少选择一种申请类型。";return}qrRequests.unshift({applicant:d.applicant,time:d.time.replace("T"," "),types,workload:types.length});state.overlay=null;toast("二维码申请已保存",`本条记录按 ${types.length} 个去重类型计入工作量。`)}else{let instrument=instrumentById(d.instrumentId);if(!instrument||instrument.projectId!==d.projectId){$("#address-error").textContent="所选仪器与项目绑定无效，请重新选择。";return}if(d.sn!==instrument.sn||d.client!==projectById(instrument.projectId)?.client){$("#address-error").textContent="客户或序列号与所选仪器不一致。";return}if(!d.account){$("#address-error").textContent="Account ID 必填。";return}addressUpdates.unshift({instrumentId:instrument.id,projectId:instrument.projectId,client:d.client,address:d.address,sn:d.sn,account:d.account,time:d.time.replace("T"," ")});instrument.shipto=d.account;removeTodosFor(instrument.projectId,t=>t.type==="缺目的地址/Ship-to"&&t.projectId===instrument.projectId&&t.instrumentId===instrument.id);state.overlay=null;toast("序列号地址更新已保存","已移除所选项目内该仪器的目的地址待办，其他同序列号仪器不受影响。")}}
function render(){$("#app").innerHTML=shell();bind();setTimeout(()=>$(".overlay input:not([type=checkbox]),.overlay select")?.focus(),0)}
function bind(){all("[data-new]").forEach(e=>e.onclick=()=>{state.draft=newDraft();state.step=1;state.overlay={kind:"wizard"};render()});all("[data-quick]").forEach(e=>e.onclick=()=>{state.overlay={kind:"quick"};render()});all("[data-action]").forEach(e=>e.onclick=()=>{state.overlay={kind:"action",type:e.dataset.action};render()});all("[data-module]").forEach(e=>e.onclick=()=>{state.overlay={kind:"module",type:e.dataset.module};render()});all("[data-close]").forEach(e=>e.onclick=close);all("[data-mask]").forEach(e=>e.onclick=v=>{if(v.target===e)close()});all("[data-stage]").forEach(e=>e.onclick=()=>{state.stage=e.dataset.stage;let x=projects.find(v=>v.status===state.stage);if(x)state.pid=x.id;render()});all("[data-filter]").forEach(e=>e.onclick=()=>{state.filter=e.dataset.filter;render()});all("[data-project]").forEach(e=>e.onclick=()=>{state.pid=e.dataset.project;render()});all("[data-record]").forEach(e=>e.onclick=v=>{v.stopPropagation();state.pid=e.dataset.record;state.overlay={kind:"quick"};render()});all("[data-tab]").forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;render()});all("[data-todo]").forEach(e=>e.onclick=()=>{let t=todos.find(v=>v.id===e.dataset.todo);if(!t)return;state.pid=t.pid;let a=todoAction(t);state.overlay=a==="address"?{kind:"module",type:"address",projectId:t.projectId,instrumentId:t.instrumentId}:{kind:"action",type:a};render()});all("[data-cancel]").forEach(e=>e.onclick=()=>{state.overlay={kind:"cancel"};render()});$("[data-back]")?.addEventListener("click",()=>{state.step--;render()});$("#wizard")?.addEventListener("submit",e=>{e.preventDefault();if(e.target.reportValidity())wizardNext(e.target)});all("[data-wsubmit]").forEach(e=>e.onclick=()=>submitWizard(e.dataset.wsubmit));$("#action-form")?.addEventListener("submit",e=>{e.preventDefault();submitAction(e.target.dataset.type,e.target)});$("#module-form")?.addEventListener("submit",e=>{e.preventDefault();submitModule(e.target.dataset.moduleForm,e.target)});$("#cancel-form")?.addEventListener("submit",e=>{e.preventDefault();if(p().dropHistory)return;if(!e.target.reportValidity())return;p().status="已取消";p().tags=["已取消"];state.overlay=null;toast("搬迁项目已取消","该操作不可恢复，既有实际成本记录继续保留。")});
let qrs=all('[name="qrType"]');qrs.forEach(e=>e.onchange=()=>{let n=new Set(all('[name="qrType"]:checked').map(x=>x.value)).size;$("#qr-count").textContent=n+" 类";$("#qr-work").textContent=n});let budget=$("[name=budget]"),deal=$("[name=deal]"),cost=$("[name=cost]");[budget,deal,cost].filter(Boolean).forEach(e=>e.oninput=()=>{let b=Number(budget.value)||0,d=Number(deal.value)||0,c=Number(cost.value)||0;$("#deal-warning").classList.toggle("hidden",!(d>b));$("#log-preview").innerHTML=`<div><span>成交价格</span><b>${money(d,"RMB")}</b></div><div><span>物流费用</span><b>${money(c,"RMB")}</b></div><div><span>差异</span><b>${money(c-d,"RMB")}</b></div>`});let amount=$("#action-form [name=amount]"),dp=$("#drop-preview");if(amount&&dp&&$("#drop-error"))amount.oninput=()=>{let a=Number(amount.value)||0,x=p(),after=x.dropped+a,rem=x.finalAmount-after;dp.innerHTML=`<div><span>当前累计</span><b>${money(x.dropped)}</b></div><div><span>本次后累计</span><b>${money(after)}</b></div><div><span>剩余</span><b>${money(Math.max(rem,0))}</b></div>`;$("#drop-error").textContent=rem<0?"累计掉票不能超过最终可确认金额。":""};let cur=$("[name=currency]"),dam=$("#action-form [name=amount]"),rate=$("#rate-note");if(cur&&dam&&rate){let upd=()=>{let a=Number(dam.value)||0;rate.textContent=`一个事项只登记一个备件；多个备件分别建立事项。${cur.value==="RMB"?`RMB ${a} 按 1 USD = 7.2 RMB 固定折算为 USD ${(a/7.2).toFixed(2)}。`:"USD 金额直接用于统计。"}`};cur.onchange=upd;dam.oninput=upd}let search=$("#address-search"),date=$("#address-date");if(search){let run=()=>{let q=search.value.trim().toLowerCase(),d=date.value;let list=addressUpdates.filter(r=>(!q||Object.values(r).join(" ").toLowerCase().includes(q))&&(!d||r.time.startsWith(d)));$("#address-list").innerHTML=addressTable(list)};search.oninput=run;date.oninput=run;$("#clear-search").onclick=()=>{search.value="";date.value="";run()}}}
document.addEventListener("click",e=>{let button=e.target.closest("[data-qr-toggle]");if(!button)return;let item=instrumentById(button.dataset.qrToggle);if(item){item.qr=item.qr==="是"?"否":"是";toast("二维码标记已更新",`${projectById(item.projectId)?.name} 的 ${item.sn} 已手工标记为“${item.qr}”；未生成待办。`)}});document.addEventListener("change",e=>{if(e.target.name!=="instrumentId"||e.target.form?.dataset.moduleForm!=="address")return;let item=instrumentById(e.target.value),project=item&&projectById(item.projectId);if(!item||!project)return;e.target.form.elements.projectId.value=item.projectId;e.target.form.elements.client.value=project.client;e.target.form.elements.sn.value=item.sn});window.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.overlay)close()});render();
})();
